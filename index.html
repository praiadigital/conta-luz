<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conta Luz — Analisador de Energia | Praia Digital</title><meta name="description" content="Analise a conta de energia do seu imóvel de temporada e descubra onde cortar desperdício."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#fdf9e8,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #b8960b22}h1{color:#8f720a;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #efe6c4;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#b8960b;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#fdf6dd;border-radius:12px;padding:1rem}.barra{height:12px;border-radius:8px;background:#eee;margin:.2rem 0 .8rem;overflow:hidden}.barra i{display:block;height:100%}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#b8960b;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/calculadora-energia">Calculadora Solar</a> · <a href="https://praia.digital/ar-condicionado-roi">AC ROI</a> · <a href="https://praia.digital/brisa-vento">Brisa & Vento</a></nav><div class="card"><h1>⚡ Conta Luz</h1><p>Onde sua energia vai embora num imóvel de temporada?</p><label>Valor médio da conta (R$/mês)</label><input id="c" type="number" value="380"><label>Ar-condicionado tipo</label><select id="ac"><option value="0.42">Split antigo</option><option value="0.30" selected>Split inverter</option><option value="0">Sem AC</option></select><label>Chuveiro elétrico?</label><select id="ch"><option value="0.28" selected>Sim</option><option value="0">Não (gás/solar)</option></select><label>Piscina com bomba?</label><select id="pi"><option value="0.14">Sim</option><option value="0" selected>Não</option></select><button onclick="calc()">Analisar</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const c=g('c');const itens=[['Ar-condicionado',g('ac'),'#27548a'],['Chuveiro',g('ch'),'#b03a6b'],['Piscina/bomba',g('pi'),'#0480a8'],['Geladeira+iluminação+outros',Math.max(0.15,1-g('ac')-g('ch')-g('pi')-0.05),'#2e7d4f']];let html='';itens.forEach(([n,f,cor])=>{const v=c*f;html+=`<p style="font-size:.9rem">${n}: <b>R$ ${v.toFixed(0)}</b></p><div class="barra"><i style="width:${f*100}%;background:${cor}"></i></div>`});const eco=c*0.25;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=html+`<p>💡 Corte rápido (lâmpadas LED, timer na bomba, AC 24°C): <b>~R$ ${eco.toFixed(0)}/mês</b></p><p>☀️ Longo prazo: simule painéis na <a href="https://praia.digital/calculadora-energia">Calculadora Solar</a> e o upgrade de AC no <a href="https://praia.digital/ar-condicionado-roi">AC ROI</a>.</p>`}</script></body></html>
